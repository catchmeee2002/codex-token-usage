name: Bug report
description: Report incorrect behavior or token accounting
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Remove prompts, responses, API keys, session IDs, and private paths before submitting.

  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `codex-token-usage --version`
      placeholder: codex-token-usage 0.2.0
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
        - Other
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: Command or UI action
      description: What command did you run, or what did you select in the UI?
      render: shell
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: Include warnings or a minimal reproduction, with private data removed.

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, prompts, responses, session IDs, and private paths.
          required: true
